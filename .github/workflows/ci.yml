name: CI

# Shared CI (platform-ci-workflows): lint, typecheck, node --test suite, build, security scan.
# Public repository -> GitHub-hosted runners (CI hosting policy). Separate from autopilot.yml,
# whose own gates (npm test, lint, build) are unchanged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      require-tests: true
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  design-floor:
    # ADR-0007 design floor (12 rules, 5 widths) on a production build. The analytics flags make
    # the PDPA consent banner render as it does in production (placeholder key: nothing is sent
    # before consent, and CI never consents).
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/design-floor.yml@81b568fb872c94269ccbd3955b4f16bf025c767b # v1.5.3
    with:
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build
      build-env: |
        NEXT_PUBLIC_ANALYTICS_ENABLED=true
        NEXT_PUBLIC_POSTHOG_KEY=phc_ci_placeholder

  autopilot-pr-status:
    # Autopilot runs this workflow on its own PR branches with workflow_dispatch (a PR opened with
    # GITHUB_TOKEN starts no workflow). Such a run is not attached to the PR, so report the overall
    # result as a commit status on the head commit, which the PR's checks list does show.
    name: CI (autopilot PR)
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [web, security, design-floor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the result on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          state=success
          for r in $RESULTS; do [ "$r" = success ] || state=failure; done
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context="CI (autopilot PR)" \
            -f target_url="$RUN_URL" -f description="ci.yml (workflow_dispatch): $state"
